apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  name: {{ .Release.Name }}-manager-role
rules:
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters/finalizers
  verbs:
  - update
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters/status
  verbs:
  - get
  - patch
  - update
