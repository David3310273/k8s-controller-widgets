# This rule is not used by the project azure-hci-node-watcher itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to hci.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: azure-hci-node-watcher
    app.kubernetes.io/managed-by: kustomize
  name: AzureHCICluster-viewer-role
rules:
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters/status
  verbs:
  - get