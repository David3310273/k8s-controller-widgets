# This rule is not used by the project azure-hci-node-watcher itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over hci.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: azure-hci-node-watcher
    app.kubernetes.io/managed-by: kustomize
  name: AzureHCICluster-admin-role
rules:
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters
  verbs:
  - '*'
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters/status
  verbs:
  - get