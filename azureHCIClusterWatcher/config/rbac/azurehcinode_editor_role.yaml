# This rule is not used by the project azure-hci-node-watcher itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the hci.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: azure-hci-node-watcher
    app.kubernetes.io/managed-by: kustomize
  name: AzureHCICluster-editor-role
rules:
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hci.example.com
  resources:
  - azurehciclusters/status
  verbs:
  - get